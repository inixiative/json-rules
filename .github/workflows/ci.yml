name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    uses: inixiative/config/.github/workflows/lib-ci.yml@main
    with:
      # The mysqld binary test/whereSql.mysql.test.ts downloads through mysql-memory-server; the
      # key's version stays in step with MYSQL_VERSION there.
      cache-path: /tmp/mysqlmsn/binaries
      cache-key: mysqlmsn-mysql-8.4.11
